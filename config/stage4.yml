# DeepRAG Engine - Stage 4 配置（Agentic RAG）

llm:
  baseUrl: "http://localhost:11434/v1"
  apiKey: "ollama"
  model: "qwen2.5"
  timeout: 60

embedding:
  baseUrl: "http://localhost:11434"
  model: "nomic-embed-text"
  dimension: 768
  timeout: 30

vectorStore:
  host: "localhost"
  port: 19530
  collectionPrefix: "deeprag_"

chunker:
  strategy: "parent_child"
  maxSize: 500
  overlap: 50
  childSize: 128
  childOverlap: 30

retriever:
  strategy: "hybrid"
  topK: 20
  finalTopK: 5
  scoreThreshold: 0.3
  denseWeight: 0.5
  sparseWeight: 0.5
  dynamicWeight: true
  rrfK: 60

queryEngine:
  enabled: true
  enableRewrite: true
  enableHyDE: true
  enableMultiQuery: true
  enableDecomposition: true

reranker:
  enabled: true
  baseUrl: "http://localhost:11434"
  model: "qllama/bge-reranker-v2-m3"
  timeout: 30

generator:
  enableCitation: true
  enableHallucinationDetection: true
  contextCompressionThreshold: 0.3
  maxContextTokens: 3000

strategy:
  name: "agentic"
  selfRag:
    maxRetries: 2
  crag:
    highThreshold: 0.8
    lowThreshold: 0.5
  adaptive:
    parallelSubQueries: true
    maxSubQueries: 5
  agentic:
    maxIterations: 2

api:
  port: 8080

evaluation:
  datasetPath: "evaluation/eval_set.json"
  reportPath: "evaluation/reports"
